[build]
  command = "npm run build:client"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the separately hosted Express service. Replace this host
# with the production backend domain before the first deploy.
[[redirects]]
  from = "/api/*"
  to = "https://api.example.com/api/:splat"
  status = 200
  force = true

# Keep browser routes working when the SPA is hosted on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[context.production.environment]
  VITE_API_BASE_URL = "https://api.example.com"
